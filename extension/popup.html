<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ScamShield AI</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <h2>🛡️ ScamShield AI</h2>
      <p class="subtitle">AI Phishing & Scam Detection</p>
    </header>
    
    <div class="tabs">
      <button id="tab-url" class="active">Scan Current URL</button>
      <button id="tab-text">Scan Text</button>
    </div>

    <div id="content-url" class="tab-content active">
      <p>Current Page:</p>
      <div id="current-url" class="url-display">Loading...</div>
      <button id="scan-url-btn" class="primary-btn">Analyze This Page</button>
    </div>

    <div id="content-text" class="tab-content">
      <textarea id="text-input" placeholder="Paste an email, message, or text here..." rows="4"></textarea>
      <button id="scan-text-btn" class="primary-btn">Analyze Text</button>
    </div>

    <div id="loading" class="hidden">
      <div class="spinner"></div>
      <p>Analyzing with AI...</p>
    </div>

    <div id="result-container" class="hidden">
      <div id="classification-badge" class="badge"></div>
      <div class="risk-score">
        <span id="score-val">--</span><span class="score-max">/100</span> Risk
      </div>
      <p id="explanation"></p>
      <button id="reset-btn" class="secondary-btn">Scan Another</button>
    </div>
    
    <div id="error-container" class="hidden">
      <p id="error-message"></p>
      <button id="reset-error-btn" class="secondary-btn">Try Again</button>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
